<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found: Taskmarket in the open</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(700px 480px at 80% -10%, #3a1420, transparent 65%), #12100e;
    color: #efe9e2;
    font-family: Georgia, "Times New Roman", serif;
  }
  main { max-width: 520px; }
  p.eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b0a79d;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(38px, 8vw, 64px);
    line-height: 1;
    margin: 14px 0 18px;
    color: #fff6e8;
  }
  h1 em { color: #e74079; font-style: italic; }
  p { color: #b0a79d; line-height: 1.55; }
  a {
    display: inline-block;
    margin-top: 18px;
    color: #efe9e2;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    text-decoration: none;
    border-bottom: 1px solid #453e37;
    padding-bottom: 3px;
  }
  a:hover { color: #d9a097; border-color: #d9a097; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Taskmarket in the open</p>
  <h1>That page is not <em>here</em>.</h1>
  <p>The dashboard lives at the home page. If a share link brought you here, the view may have moved.</p>
  <a href="./" data-home>Open the dashboard</a>
</main>
<script>
  // Resolve the dashboard root without hardcoding the repository name. On a
  // project site the first path segment is the repo; on a user site it is not.
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var home = "/";
    if (/\.github\.io$/i.test(location.hostname) && parts.length && /^[^.]/.test(parts[0])) {
      home = "/" + parts[0] + "/";
    }
    var link = document.querySelector("[data-home]");
    if (link) link.setAttribute("href", home);
  })();
</script>
</body>
</html>
